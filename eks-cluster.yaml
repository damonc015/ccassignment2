apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cchw2
  region: us-east-1

vpc:
  nat:
    gateway: Disable

iam:
  withOIDC: true

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
    configurationValues: '{"defaultStorageClass":{"enabled":true}}'

managedNodeGroups:
  - name: web-nodes
    instanceType: t3.medium
    desiredCapacity: 2
