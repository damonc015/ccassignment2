defaultRules:
  create: false

grafana:
  enabled: false

additionalPrometheusRulesMap:
  web-alerts:
    groups:
      - name: web
        rules:
          - alert: WebProbeFailures
            expr: sum(increase(prober_probe_total{container="web",result="failed"}[2m])) > 2
            labels:
              severity: warning
            annotations:
              summary: More than 2 web probe failures in the last 2 minutes
          - alert: WebPodReplaced
            expr: time() - max(kube_pod_start_time{namespace="default",pod=~"web-.*"}) < 180
            labels:
              severity: warning
            annotations:
              summary: A web pod was created in the last 3 minutes

prometheus:
  prometheusSpec:
    evaluationInterval: 15s
    scrapeInterval: 15s

alertmanager:
  alertmanagerSpec:
    secrets:
      - slack-webhook
  config:
    route:
      receiver: slack
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes: []
    inhibit_rules: []
    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            send_resolved: true
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
            text: '{{ .CommonAnnotations.summary }}'
